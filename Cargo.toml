[package]
name = "apache-kafka-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Lightweight Apache Kafka web UI written in Rust"
license = "Apache-2.0"
readme = "README.md"
keywords = ["kafka", "ui", "axum", "rust"]
categories = ["web-programming"]

[dependencies]
async-stream = "0.3.6"
askama = "0.15.4"
axum = "0.8.4"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
